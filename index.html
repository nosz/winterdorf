.brand .dot svg{width:24px;height:auto;display:block}.brand .dot{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--pri-d);display:grid;place-items:center;font-size:1.2rem;box-shadow:0 2px 0 rgba(0,0,0,.2)}

.theme.off{position:relative;opacity:.75}.theme.off::after{content:"";position:absolute;left:9px;right:9px;top:50%;height:3px;border-radius:2px;background:#fff;box-shadow:0 0 0 1.5px var(--pri);transform:rotate(-45deg)}
.theme{font-size:1.1rem;padding:0;display:inline-flex;align-items:center;justify-content:center;line-height:1}.theme svg{display:block;flex:none}
.boost{background:#fff;border-color:#fff;animation:boostpulse 2.8s ease-in-out infinite}.boost svg{width:20px;height:auto;display:block}.boost.busy{opacity:.6;cursor:default;animation:none}.boost.nein{animation:boostnein .38s}@keyframes boostnein{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@keyframes boostpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@media(prefers-reduced-motion:reduce){.boost{display:none}}@media print{.boost{display:none}}
/* Layout */

.res .bigstars span{display:inline-block;animation:star .6s both}

["Muss man reservieren, um im Winterdorf mitzufeiern?","Nein, wer früher da ist, feiert länger","Ja, immer","Nur donnerstags","Nur ab 18 Uhr","Eine Reservierung braucht man nicht. Je früher du da bist, desto kürzer die Wartezeit."],
["Wie hoch ist der Getränkemindestumsatz bei einem 8er- oder 10er-Tisch?","15 € pro Person","5 € pro Person","30 € pro Person","Es gibt keinen","15 € pro Person. Anzahlung: 40 € für den 8er-, 50 € für den 10er-Tisch."],
["Wie viele Tische können pro Abend maximal reserviert werden?","Zwei","Fünf","Zehn","Einer","Pro Abend sind maximal zwei Tische reservierbar."],
["Für wie viele Personen ist die Talstation gedacht?","Bis 25 Personen","Bis 8 Personen","Bis 100 Personen","Nur für 2","Talstation: bis 25 Personen, 250 € Hüttenmiete plus 250 € Mindestumsatz."],
["Wie viele Personen feiern maximal im komplett exklusiv gebuchten Winterdorf?","450","150","1.000","250","Im kompletten Winterdorf feiern maximal 450 Personen."]]},
{t:"Hausregeln & Sicherheit",d:"Pistenwache, Dresscode und Luisa",tip:"Gute Laune gewinnt, aber immer mit Respekt. Das gilt auch für Elche.",learn:["Über den Einlass entscheidet allein die Pistenwache. Eine Reservierung ist keine Eintrittskarte.","Hüttengaudi-Abende sind 18+.","Dresscode: gemütlich und gepflegt. Fanbekleidung und Sportkleidung bleiben zu Hause, Caps pausieren in den Hütten. Hunde müssen draußen bleiben.","Rauchen und Vapen nur in den Außenbereichen. „Luisa ist hier“: Bei Unwohlsein sofort das Team fragen.","Wind, Regen, Schnee: grundsätzlich geöffnet. Fluchtwege und Notausgänge bleiben immer frei."],q:[
["Wer entscheidet über den Einlass?","Die Pistenwache","Die Reservierung","Der Zufall","Der Elch","Ausschließlich die Pistenwache. Eine Reservierung ist keine Eintrittskarte."],
["Ab welchem Alter ist an Hüttengaudi-Abenden der Eintritt möglich?","18 Jahre","16 Jahre","21 Jahre","14 Jahre","Hüttengaudi-Abende sind 18+."],
["Welche Kleidung bleibt bitte zu Hause?","Fantrikots und Sportkleidung","Wollmützen","Winterjacken","Schals ohne Vereinsfarben","Fanbekleidung und Trainingskleidung sind nicht gestattet, Caps machen in den Hütten Pause."],
["Dürfen Hunde ins Winterdorf?","Nein, sie müssen draußen bleiben","Ja, an der Leine","Nur kleine Hunde","Nur in der Kiliansalm","Es ist einfach zu viel los, zu eng und zu laut für entspannte Hundestimmung."],
["Wo darf man rauchen oder vapen?","Nur in den Außenbereichen","In der Kiliansalm","Im Kuhstall","Überall","Rauch und Dampf bleiben draußen, ausschließlich in den vorgesehenen Außenbereichen."],
["Nach wem fragt man, wenn man sich unwohl fühlt?","Luisa","Elisa","Martha","Hanna","„Luisa ist hier“: Das Team weiß sofort, was zu tun ist."],
["Was gilt bei Wind, Regen oder Schnee?","Grundsätzlich ist geöffnet","Das Winterdorf bleibt zu","Eintritt wird billiger","Nur der Kuhstall ist offen","Wir sind schließlich ein Winterdorf! Bei Glätte bitte mit Köpfchen unterwegs sein."]]},
{t:"Garderobe & Zahlung",d:"Jacke, Bargeld und Fundsachen",tip:"Garderobenmarke gut festhalten, sonst wird's ein langer Abend ohne Jacke!",learn:["Garderobe: 2 €, solange noch Platz ist. Jacken gibt es nur gegen die richtige Marke zurück. Wertsachen mitnehmen!","Marke weg? Sofort dem Garderobenpersonal melden.","Bezahlt wird bar. Ab 150 € gibt es an der Kasse Bargeld per EC-Karte.","Fundsachen: am nächsten Öffnungstag ab 17 Uhr abholen, danach geht es ans Fundbüro der Stadt Heilbronn."],q:[
["Wie zahlt man im Winterdorf?","Bar","Nur mit Karte","Per Handy-App","Auf Rechnung","Bei uns wird bar bezahlt. Ab 150 € gibt es an der Kasse Bargeld per EC-Karte."],
["Was kostet die Garderobe?","2 €","1 €","5 €","Sie ist gratis","2 €, solange noch Platz ist. Die Marke ist dein Rückfahrtticket für die Jacke!"],
["Was tun, wenn die Garderobenmarke weg ist?","Sofort dem Garderobenpersonal melden","Nichts, die Jacke kommt von allein","Morgen wiederkommen","Eine andere Marke nehmen","Ohne Marke gibt es die Jacke erst, wenn eindeutig geklärt ist, wem sie gehört."],
["Wohin kommen Fundsachen nach dem nächsten Öffnungstag?","Zum Fundbüro der Stadt Heilbronn","In den Müll","Zum Elch nach Hause","Zur Polizei Stuttgart","Abholung direkt im Winterdorf nur am nächsten Öffnungstag ab 17 Uhr."]]},
{t:"Genuss, Musik & Team",d:"Glühwein, Beats und das #Elchteam",tip:"Das #Elchteam ist das beste Team der Welt. Sagt der Elch. Ganz unparteiisch.",learn:["Glühwein und Flaschenwein kommen vom Weingut G.A. Heinrich, Bier frisch gebraut von Dinkelacker. Dazu gibt es deftige Winterdorfburger, auch vegan.","Regionalität ist der Schlüssel: kurze Lieferwege, Partner aus der Region.","Kiliansalm Spezial: immer donnerstags, elektronische Beats und Glühwein-Daydrinking. Den Auftakt macht KIWI am 12. November 2026, danach SONORA und aurum.","Das Team heißt #Elchteam. Hier bin ich natürlich Ehrenmitglied!"],q:[
["Woher kommt der Glühwein im Winterdorf?","Weingut G.A. Heinrich","Aus dem Supermarkt","Aus Österreich","Vom Weingut Fischer aus Italien","Vom prämierten Weingut G.A. Heinrich. Die Biere kommen frisch gebraut von Dinkelacker."],
["Welche Burger gibt es?","Deftige Winterdorfburger, auch vegan","Nur Fischburger","Nur Pizza","Keine","Deftige Winterdorfburger, auch vegan."],
["An welchem Wochentag laufen die Kiliansalm-Spezial-Abende?","Donnerstag","Montag","Sonntag","Dienstag","Immer donnerstags, mit elektronischen Beats und Glühwein-Daydrinking."],
["Wer macht am 12. November 2026 den Auftakt der Reihe?","KIWI","SONORA","aurum","TONight","KIWI übernimmt das Winterdorf, danach folgen SONORA und aurum."],
["Wie heißt das Winterdorf-Team?","#Elchteam","#Hüttenteam","#Glühweinteam","#Dorfpolizei","Das #Elchteam sorgt für volle Gläser und blitzblanke Tische. Passt zu mir!"]]},

{t:"The Village",d:"History, huts and cosiness",tip:"Hut fun on the village square: if you're cold, stand by the fire!",learn:["Winterdorf Heilbronn has existed since 2012: the first full-service winter village in Germany.","The legendary party huts Neckaralm and Kiliansalm are its heart.","On the village square, many fire pits and a heated cowshed with seating keep you warm.","Season 14 runs in 2026/27: 6 November 2026 to 23 January 2027."],q:[
["Since when has Winterdorf Heilbronn existed?","Since 2012","Since 2002","Since 2018","Since 1999","Since 2012: the first full-service winter village in Germany."],
["What are the two legendary party huts called?","Neckaralm and Kiliansalm","Talstation and Jausenalm","Cowshed and village square","Neckarhütte and Kilianshaus","Neckaralm and Kiliansalm are the heart of the Winterdorf."],
["Where do you find warmth on the village square in rough weather?","At fire pits and in the heated cowshed","Only at the cloakroom","In the tent at the entrance","Nowhere","Many fire pits and a warm cowshed with seating."],
["Which season is running in 2026/27?","The 14th","The 10th","The 5th","The 20th","The 14th season, from 6 November 2026 to 23 January 2027."]]},
{t:"Opening & Getting There",d:"When, where and safely home",tip:"After mulled wine, take the buddy or a taxi. Even I don't trot home alone!",learn:["Open Wednesday to Saturday, 5 pm to midnight. Last admission: 11:30 pm.","Address: Badstraße 100, 74072 Heilbronn, right on the Neckar bank.","On foot: about 20 minutes from the main station, about 780 metres (13 minutes) from the Theresienwiese stop.","Getting home: buddy by SWHN (max. €5, €2.50 with an HNV pass) or the FiftyFifty taxi for 16 to 25-year-olds in the district (50 % of the fare)."],q:[
["On which days is the Winterdorf normally open?","Wednesday to Saturday","Monday to Friday","Weekends only","Every day","Wed to Sat, from 5 pm to midnight."],
["When is last admission?","11:30 pm","10:00 pm","11:00 pm","At midnight","Party until midnight, last admission is at 11:30 pm."],
["What is the Winterdorf's address?","Badstraße 100, Heilbronn","Marktplatz 1, Heilbronn","Theresienstraße 5, Heilbronn","Neckarmeile 12, Heilbronn","Badstraße is right on the Neckar bank in the city centre."],
["How far is it from the Theresienwiese stop to the Winterdorf?","About 780 metres","About 3 kilometres","About 50 metres","About 2 kilometres","Around 13 minutes on foot. From the main station it is about 20 minutes."],
["What is the maximum price of the SWHN buddy service for getting home?","€5.00","€10.00","€2.00","It is free","Maximum €5, only €2.50 with an HNV pass, however long the trip."],
["Who can use the FiftyFifty taxi in the Heilbronn district?","Young people aged 16 to 25","Everyone over 18","Seniors only","Children under 12","You pay only 50 % of the fare, the district pays the rest."]]},
{t:"Reservations",d:"Tables, huts and minimum spend",tip:"You don't have to reserve, but come early and you get the best spot by the fire.",learn:["You don't need a reservation. Come early and party longer.","Table for 8 or 10: €15 minimum drinks spend per person. Deposit €40 (8) or €50 (10). Maximum two tables per evening.","Talstation: groups up to 25, €250 hut hire plus €250 minimum spend, Wed to Sat.","Kiliansalm, Neckaralm or the whole Winterdorf can be requested. In the whole village, a maximum of 450 people party."],q:[
["Do you have to reserve to join the party?","No, come early and party longer","Yes, always","Thursdays only","Only after 6 pm","You don't need a reservation. The earlier you arrive, the shorter the wait."],
["What is the minimum drinks spend for a table of 8 or 10?","€15 per person","€5 per person","€30 per person","There is none","€15 per person. Deposit: €40 for 8, €50 for 10."],
["How many tables can be reserved per evening at most?","Two","Five","Ten","One","A maximum of two tables can be reserved per evening."],
["How many people is the Talstation meant for?","Up to 25","Up to 8","Up to 100","Just 2","Talstation: up to 25 people, €250 hut hire plus €250 minimum spend."],
["How many people party at most when the whole Winterdorf is booked exclusively?","450","150","1,000","250","A maximum of 450 people party in the whole Winterdorf."]]},
{t:"House Rules & Safety",d:"Door team, dress code and Luisa",tip:"Good vibes win, always with respect. That goes for moose too.",learn:["Only the door team (Pistenwache) decides on admission. A reservation is not a ticket.","Hüttengaudi evenings are 18+.","Dress code: cosy and neat. Fan gear and sportswear stay at home, caps take a break in the huts. Dogs must stay outside.","Smoking and vaping only in the outdoor areas. “Luisa ist hier”: if you feel uneasy, ask the team right away.","Wind, rain, snow: generally open. Escape routes and emergency exits always stay clear."],q:[
["Who decides on admission?","The Pistenwache (door team)","The reservation","Chance","The moose","Only the Pistenwache. A reservation is not a ticket."],
["From what age is entry possible on Hüttengaudi evenings?","18 years","16 years","21 years","14 years","Hüttengaudi evenings are 18+."],
["Which clothing should stay at home?","Fan jerseys and sportswear","Woolly hats","Winter jackets","Scarves without club colours","Fan gear and training clothes are not allowed; caps take a break in the huts."],
["Are dogs allowed in the Winterdorf?","No, they must stay outside","Yes, on a lead","Only small dogs","Only in the Kiliansalm","It's simply too busy, tight and loud for a relaxed dog mood."],
["Where may you smoke or vape?","Only in the outdoor areas","In the Kiliansalm","In the cowshed","Everywhere","Smoke and vapour stay outside, only in the designated outdoor areas."],
["Who do you ask for if you feel uneasy?","Luisa","Elisa","Martha","Hanna","“Luisa ist hier”: the team knows right away what to do."],
["What applies in wind, rain or snow?","Generally open","The Winterdorf closes","Entry gets cheaper","Only the cowshed is open","We are a winter village after all! Mind the ice and wear proper shoes."]]},
{t:"Cloakroom & Payment",d:"Jacket, cash and lost property",tip:"Hold on tight to your cloakroom token, or it's a long evening without a jacket!",learn:["Cloakroom: €2, while there is space. Jackets are only returned against the right token. Take valuables with you!","Token lost? Tell the cloakroom staff right away.","Payment is cash only. From €150 you can get cash with an EC card at the till.","Lost property: collect on the next opening day from 5 pm, after that it goes to the Heilbronn lost property office."],q:[
["How do you pay in the Winterdorf?","Cash","Card only","By phone app","On invoice","We take cash. From €150 you can withdraw cash with an EC card at the till."],
["How much is the cloakroom?","€2","€1","€5","It is free","€2, while there is space. The token is your ticket home for your jacket!"],
["What if your cloakroom token is gone?","Tell the cloakroom staff right away","Nothing, the jacket comes back by itself","Come back tomorrow","Take another token","Without a token, the jacket is only handed over once it is clear who it belongs to."],
["Where does lost property go after the next opening day?","To the Heilbronn city lost property office","Into the bin","Home with the moose","To Stuttgart police","Collection at the Winterdorf is only possible on the next opening day from 5 pm."]]},
{t:"Treats, Music & Team",d:"Mulled wine, beats and the #Elchteam",tip:"The #Elchteam is the best team in the world. Says the moose. Totally unbiased.",learn:["Mulled wine and bottled wine come from Weingut G.A. Heinrich, beer freshly brewed by Dinkelacker. Plus hearty Winterdorf burgers, also vegan.","Regional is the key: short supply routes, partners from the region.","Kiliansalm Spezial: always on Thursdays, electronic beats and mulled-wine day drinking. KIWI kicks off on 12 November 2026, then SONORA and aurum.","The team is called #Elchteam. I'm an honorary member, of course!"],q:[
["Where does the mulled wine in the Winterdorf come from?","Weingut G.A. Heinrich","From the supermarket","From Austria","From Weingut Fischer in Italy","From the award-winning Weingut G.A. Heinrich. The beers are freshly brewed by Dinkelacker."],
["Which burgers are there?","Hearty Winterdorf burgers, also vegan","Fish burgers only","Pizza only","None","Hearty Winterdorf burgers, also vegan."],
["On which weekday do the Kiliansalm Spezial evenings run?","Thursday","Monday","Sunday","Tuesday","Always Thursdays, with electronic beats and mulled-wine day drinking."],
["Who kicks off the series on 12 November 2026?","KIWI","SONORA","aurum","TONight","KIWI takes over the Winterdorf, followed by SONORA and aurum."],
["What is the Winterdorf team called?","#Elchteam","#Hüttenteam","#Glühweinteam","#Dorfpolizei","The #Elchteam keeps glasses full and tables spotless. Suits me!"]]},

{t:"s' Dorf",d:"Gschicht, Hütta und Gmüatlichkeit",tip:"Hüttagaudi uffm Dorfplatz: Wer friert, stoht ans Feuer!",learn:["Seit 2012 gibt's s' Winterdorf Heilbronn: s' erschte vollgastronomische Winterdorf in ganz Deutschland.","D' legendäre Feierhütta Neckaralm und Kiliansalm send s' Herzstück.","Uffm Dorfplatz wärmed viele Feuerstella und a gheizter Kuhstall mit Sitzplätz.","2026/27 läuft d' 14. Saison: 6. November 2026 bis 23. Januar 2027."],q:[
["Seit wann gibt's s' Winterdorf Heilbronn?","Seit 2012","Seit 2002","Seit 2018","Seit 1999","Seit 2012: s' erschte vollgastronomische Winterdorf in Deutschland."],
["Wie hoißet d' zwoi legendäre Feierhütta?","Neckaralm und Kiliansalm","Talstation und Jausenalm","Kuhstall und Dorfplatz","Neckarhütt und Kilianshaus","Neckaralm und Kiliansalm send s' Herzstück vom Winterdorf."],
["Wo kriegt mr uffm Dorfplatz bei rauhem Wetter Wärme?","An dr Feuerstell und em gheizta Kuhstall","Bloß an dr Garderobe","Em Zelt am Eigang","Gar ned","Viele Feuerstella und a warmer Kuhstall mit Sitzplätz."],
["Dia wievielte Saison läuft 2026/27?","D' 14.","D' 10.","D' 5.","D' 20.","D' 14. Saison, vom 6. November 2026 bis 23. Januar 2027."]]},
{t:"Öffnung & Azug",d:"Wann, wohin und sicher wieder hoim",tip:"Noch am Glühwei liaber mit em buddy oder Taxi hoim. I stapf au ned alloi!",learn:["Uff hot Mittwoch bis Samschdich, 17:00 bis 24:00 Uhr. Letschter Eilass: 23:30 Uhr.","Adress: Badstraße 100, 74072 Heilbronn, direkt am Neckarufer.","Zu Fuß: vom Hauptbahnhof etwa 20 Minuta, vo dr Haltestell Theresienwiese etwa 780 Meter (13 Minuta).","Hoimweg: buddy vo dr SWHN (maximal 5 €, mit HNV-Abo 2,50 €) oder s' FiftyFifty-Taxi für 16- bis 25-Jährige em Landkreis (50 % vom Fahrpreis)."],q:[
["An wella Täg hot s' Winterdorf normalerweis uff?","Mittwoch bis Samschdich","Mondich bis Freitich","Bloß am Wochaend","Jeda Dag","Mi bis Sa, jeweils vo 17:00 bis 24:00 Uhr."],
["Wann isch dr letschte Eilass?","23:30 Uhr","22:00 Uhr","23:00 Uhr","Um Mitternacht","Gfeiert wird bis 24 Uhr, letschter Eilass isch um 23:30 Uhr."],
["Wie hoißt d' Adress vom Winterdorf?","Badstraße 100, Heilbronn","Marktplatz 1, Heilbronn","Theresienstraße 5, Heilbronn","Neckarmeile 12, Heilbronn","D' Badstraße liegt direkt am Neckarufer, mitta en dr Innestadt."],
["Wie weit isch es vo dr Haltestell Theresienwiese ins Winterdorf?","Etwa 780 Meter","Etwa 3 Kilometer","Etwa 50 Meter","Etwa 2 Kilometer","Rund 13 Minuta z' Fuß. Vom Hauptbahnhof send's etwa 20 Minuta."],
["Was koschtet dr buddy-Service vo dr SWHN fürn Hoimweg maximal?","5,00 €","10,00 €","2,00 €","Er isch kostelos","Maximal 5 €, mit HNV-Abo bloß 2,50 €, egal wie weit."],
["Für wen gilt s' FiftyFifty-Taxi em Landkreis Heilbronn?","Jugendliche vo 16 bis 25 Johr","Älle ab 18 Johr","Bloß Senioren","Kinder unter 12","Du zahlsch bloß 50 % vom Fahrpreis, de Rescht zahlt dr Landkreis."]]},
{t:"Reservierung",d:"Tisch, Hütta und Mindeschtumsatz",tip:"Reservieren muss mr ned, aber wer fruah kommt, kriagt dr beschte Platz am Feuer.",learn:["A Reservierung braucht mr ned. Wer fruacher do isch, feiert länger.","8er- oder 10er-Tisch: 15 € Getränkemindeschtumsatz pro Person. Azahlung 40 € (8er) bzw. 50 € (10er). Maximal zwoi Tisch pro Abend.","Talstation: Gruppa bis 25 Persona, 250 € Hüttamiete plus 250 € Mindeschtumsatz, Mi bis Sa.","Kiliansalm, Neckaralm oder s' ganze Winterdorf ka mr azfraga. Em ganza Dorf feiered maximal 450 Persona."],q:[
["Muss mr reserviera, zum em Winterdorf mitfeira?","Noi, wer fruacher do isch, feiert länger","Ja, emmer","Bloß donnerschdichs","Bloß ab 18 Uhr","A Reservierung braucht mr ned. Je fruacher du do bisch, desto kürzer d' Wartezeit."],

const st=document.createElement("div");st.id="stage";st.setAttribute("aria-hidden","true");document.body.appendChild(st);
let cur=null,tok=0,bag=[],lastA="",timer=null;
const reduce=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
const pick=a=>a[Math.random()*a.length|0],F=()=>T[lang].fig,wait=ms=>new Promise(r=>setTimeout(r,ms));
const dur=t=>Math.max(4200,t.length*65);
function abort(){tok++;if(cur){try{cur.getAnimations({subtree:true}).forEach(a=>a.cancel())}catch(e){}cur.remove();cur=null}}
function mk(txt){abort();const d=document.createElement("div");d.className="fig";d.innerHTML='<div class="fb2"></div><span class="fs">'+ELK+'</span>';d.querySelector(".fb2").textContent=txt;st.appendChild(d);cur=d;return d}
async function an(el,kf,o){if(reduce())kf=[{opacity:0},{opacity:1}],o={duration:300,fill:"forwards"};try{const a=el.animate(kf,Object.assign({fill:"forwards"},o));await a.finished}catch(e){}}
const bub=(d,on)=>d.querySelector(".fb2").classList.toggle("on",on);
function textFor(k){const f=F();if(k==="name")return name?pick(f.name).replace(/\{n\}/g,name):U().ask;if(k==="witz")return pick(f.witz);if(k==="fakt"){const q=allQ();return U().elchi+" "+pick(q)[5]}if(k==="tanz")return pick(f.tanz);return pick(f.hallo)}
async function corner(k,txt,ms){const my=tok+1,d=mk(txt);d.style.right="10px";d.style.bottom="10px";const fs=d.querySelector(".fs");
  await an(d,[{transform:"translateY(170px)"},{transform:"translateY(-14px)"},{transform:"translateY(0)"}],{duration:650,easing:"ease-out"});if(tok!==my)return;bub(d,true);
  if(k==="tanz"||k==="puff"){fs.animate([{transform:"rotate(-12deg)"},{transform:"rotate(12deg) translateY(-14px)"},{transform:"rotate(-12deg)"}],{duration:520,iterations:Math.ceil(ms/520)})}
  if(k==="puff")for(let i=0;i<8;i++){const s=document.createElement("span");s.textContent=pick(["❄","✦","❅"]);s.style.cssText="position:absolute;right:"+(30+Math.random()*60)+"px;bottom:"+(40+Math.random()*40)+"px;font-size:20px;color:#f2b53c";d.appendChild(s);s.animate([{transform:"translate(0,0)",opacity:1},{transform:"translate("+(Math.random()*120-60)+"px,-"+(60+Math.random()*80)+"px)",opacity:0}],{duration:1600,delay:i*120,fill:"forwards"})}
  await wait(ms);if(tok!==my)return;bub(d,false);await an(d,[{transform:"translateY(0)"},{transform:"translateY(180px)"}],{duration:500,easing:"ease-in"});if(tok===my)abort()}
async function quer(txt){const my=tok+1,d=mk(txt),W=innerWidth,rtl=Math.random()<.5;d.style.left="0";d.style.bottom="8px";if(rtl)d.style.flexDirection="row-reverse";const fs=d.querySelector(".fs");
  bub(d,true);fs.animate([{transform:"translateY(0)"},{transform:"translateY(-12px) rotate(-4deg)"},{transform:"translateY(0)"}],{duration:560,iterations:20});
  await an(d,rtl?[{transform:"translateX("+W+"px)"},{transform:"translateX(-420px)"}]:[{transform:"translateX(-120px)"},{transform:"translateX("+(W+20)+"px)"}],{duration:Math.max(7000,W*9),easing:"linear"});if(tok===my)abort()}
async function gucken(txt){const my=tok+1,d=mk(txt);d.style.right="0";d.style.bottom="32%";
  await an(d,[{transform:"translateX(130%)"},{transform:"translateX(0)"}],{duration:700,easing:"ease-out"});if(tok!==my)return;bub(d,true);await wait(dur(txt)*.8);if(tok!==my)return;bub(d,false);await an(d,[{transform:"translateX(0)"},{transform:"translateX(130%)"}],{duration:600});if(tok===my)abort()}
async function salto(txt){const my=tok+1,d=mk(txt),W=innerWidth,fs=d.querySelector(".fs");d.style.left="8px";d.style.bottom="10px";bub(d,true);
  fs.animate([{transform:"translateY(0) rotate(0)"},{transform:"translateY(-150px) rotate(180deg)"},{transform:"translateY(0) rotate(360deg)"}],{duration:900,iterations:3,delay:500});
  await an(d,[{transform:"translateX(0)"},{transform:"translateX("+Math.min(W*.5,320)+"px)"}],{duration:3600,easing:"ease-in-out"});if(tok===my)abort()}
const ACTS=["name","quer","gucken","witz","fakt","tanz","salto","puff","sagen"];
function run(a,txt){txt=txt||textFor(a);if(a==="quer")return quer(txt);if(a==="gucken")return gucken(txt);if(a==="salto")return salto(txt);return corner(a,txt,dur(txt))}
function next(){if(!bag.length){bag=shuffle(ACTS);if(bag[0]===lastA)bag.push(bag.shift())}lastA=bag.shift();return lastA}
function sched(ms){clearTimeout(timer);timer=setTimeout(()=>{if(document.hidden||view==="quiz"||cur){sched(4000);return}run(next()).then(()=>sched(9000+Math.random()*7000))},ms)}
return{abort,start(){sched(2200)},
 react(ok){if(Math.random()<.55){const f=F();run("sagen",pick(ok?f.lob:f.trost).replace(/\{n\}/g,name))}},
 boost(){abort();const a=pick(["sagen","tanz","salto","puff","name"]);run(a,a==="tanz"?textFor("tanz"):(name?name+", ":"")+pick(F().boost)).then(()=>sched(9000))}};
})();
render();Stage.start();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
